# MongoDB for the bot and the console, in its own compose project so their deploys do not restart it.
# First start: ./init.sh. Do not use "docker compose down -v" here, it removes the data volume.
name: cmt-mongo

services:
  cmt-mongo:
    image: mongo:4.4.6        # 5.0+ needs AVX, which this VM does not have
    container_name: cmt-mongo
    hostname: cmt-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo/keyfile", "--bind_ip_all",
              "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - cmt-mongo-data:/data/db
      - ./keyfile:/etc/mongo/keyfile:ro
    networks: [cmt]
    mem_limit: 1200m
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  cmt-mongo-data:
    name: cmt-mongo-data

networks:
  cmt:
    name: cmt-net            # created by the bot's docker-compose.yml
    external: true
