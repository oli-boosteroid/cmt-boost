services:
  cmt-boost:
    build: .
    container_name: cmt-boost
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ports:
      - "7000:7000"           # Slack events
    expose:                   # Jira gateway, Docker network only
      - "7001"
    networks:
      - cmt
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

networks:
  cmt:
    name: cmt-net